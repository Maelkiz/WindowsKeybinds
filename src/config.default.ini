; ============================================================
; WindowsKeybinds configuration
; ============================================================
;
; Keys are written as Modifier+Modifier+Key, for example:
;
;   Super+C          Windows key + C
;   Super+Shift+1    Windows key + Shift + 1
;   Ctrl+Alt+Delete
;
; Modifiers: Super (or Win), Ctrl, Alt, Shift
;
; Most keys can be written as you would say them: Enter, Space,
; Tab, Esc, F1 to F24, Left, Right, Up, Down, Home, End, PgUp,
; PgDn, Insert, Delete, Backspace, Numpad0 to Numpad9, letters
; and digits.
;
; Keys that cannot be written literally in an ini file, or that
; read better spelled out, have names:
;
;   Plus Equals Minus Comma Period Semicolon Quote
;   Slash Backslash LeftBracket RightBracket Backtick
;
; These name physical keys, so Plus and Equals are the same key.
; Write Super+Shift+Equals if you want the shifted symbol.
;
; Available actions:
;
;   CenterWindow             Center the focused window on its monitor
;   CloseWindow              Close the focused window
;   LaunchBrowser            Open a new browser window
;   LaunchTerminal           Open a new terminal window
;   LaunchWindowsSettings    Open the Windows settings app
;   OpenStartMenu            Open the start menu
;   ToggleMaximization       Maximize or restore the focused window
;   ToggleDesktopIcons       Show or hide the icons on the desktop
;   GoToDesktop <n>          Switch to virtual desktop n
;   MoveWindowToDesktop <n>  Move the focused window to desktop n
;   None                     Stop the key doing anything at all


; ============================================================
; Settings
; ============================================================
;
; FollowManualMoves   Super+Shift+<number> takes you along to the
;                     desktop the window was sent to.
;
; FollowRuleMoves     A window moved by one of the rules at the
;                     bottom of this file takes you along to its
;                     desktop as it opens.
;
; UnbindStartMenu     Stop the Windows key on its own from
;                     opening the start menu. Super+<key>
;                     combinations carry on working, and
;                     OpenStartMenu gives you it back on a
;                     key of your choosing.
;
; All are true or false. 1 and 0 work too.


[Settings]

FollowManualMoves = true
FollowRuleMoves = true
UnbindStartMenu = false


[Keybinds]

Super+Enter = LaunchTerminal
Super+B = LaunchBrowser
Super+Comma = LaunchWindowsSettings
Super+F = ToggleMaximization
Super+Q = CloseWindow
Super+C = CenterWindow
Super+I = ToggleDesktopIcons

; Note: Worth having in combination with UnbindStartMenu set to true.
;       Commented out by default because it overrides Windows' own
;       shortcut for switching input language, which many people use.
; Super+Space = OpenStartMenu


F1 = None ; Stops F1 opening the help browser

Super+1 = GoToDesktop 1
Super+2 = GoToDesktop 2
Super+3 = GoToDesktop 3
Super+4 = GoToDesktop 4
Super+5 = GoToDesktop 5
Super+6 = GoToDesktop 6
Super+7 = GoToDesktop 7
Super+8 = GoToDesktop 8
Super+9 = GoToDesktop 9
Super+0 = GoToDesktop 10

Super+Shift+1 = MoveWindowToDesktop 1
Super+Shift+2 = MoveWindowToDesktop 2
Super+Shift+3 = MoveWindowToDesktop 3
Super+Shift+4 = MoveWindowToDesktop 4
Super+Shift+5 = MoveWindowToDesktop 5
Super+Shift+6 = MoveWindowToDesktop 6
Super+Shift+7 = MoveWindowToDesktop 7
Super+Shift+8 = MoveWindowToDesktop 8
Super+Shift+9 = MoveWindowToDesktop 9
Super+Shift+0 = MoveWindowToDesktop 10


; Windows of these processes get moved to the given virtual
; desktop as they open. Uncomment or add lines as you like.
[WindowRules]

; chrome.exe = 2
; Code.exe = 3
